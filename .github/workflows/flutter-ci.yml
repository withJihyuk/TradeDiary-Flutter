name: flutter-ci

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          architecture: x64
          cache: true
      - name: Create test environment
        run: cp .env.example .env
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Check generated files
        run: git diff --exit-code
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --debug --no-pub
      - name: Detect store release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          echo "release=false" >> "$GITHUB_OUTPUT"
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            exit 0
          fi

          previous="$(git show "${BEFORE_SHA}:pubspec.yaml" | awk '$1 == "version:" { print $2 }')"
          current="$(awk '$1 == "version:" { print $2 }' pubspec.yaml)"
          if [[ "$previous" == "$current" ]]; then
            exit 0
          fi

          previous_name="${previous%%+*}"
          previous_build="${previous##*+}"
          current_name="${current%%+*}"
          current_build="${current##*+}"
          highest_name="$(printf '%s\n%s\n' "$previous_name" "$current_name" | sort -V | tail -n 1)"

          if [[ "$current_name" == "$previous_name" || "$highest_name" != "$current_name" || "$current_build" -le "$previous_build" ]]; then
            echo "::error::Increase both the app version and build number: ${previous} -> ${current}"
            exit 1
          fi
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- fastlane/metadata/ko/release_notes.txt; then
            echo "::error::Update fastlane/metadata/ko/release_notes.txt for ${current}."
            exit 1
          fi
          if [[ ! -s fastlane/metadata/ko/release_notes.txt ]]; then
            echo "::error::Release notes must not be empty."
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"

  verify-ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          architecture: x64
          cache: true
      - run: xcodebuild -version
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter build ios --simulator --no-pub

  release-android:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          architecture: x64
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3.1
          bundler-cache: true
      - name: Create production environment
        shell: bash
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_KEY: ${{ secrets.DB_KEY }}
          API_URL: ${{ secrets.API_URL }}
          CDN_URL: ${{ secrets.CDN_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: bash .github/scripts/create-env.sh
      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD SUPPLY_JSON_KEY_DATA; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::production secret ${name} is missing"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build appbundle --release --no-pub
      - name: Verify AAB signature
        shell: bash
        run: |
          if ! verification="$(jarsigner -verify build/app/outputs/bundle/release/app-release.aab 2>&1)"; then
            printf '%s\n' "$verification"
            exit 1
          fi
          if [[ "$verification" != *"jar verified."* ]]; then
            printf '%s\n' "$verification"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Submit to Google Play
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android submit

  release-ios:
    needs: [verify, verify-ios]
    if: needs.verify.outputs.release == 'true'
    runs-on: macos-15
    environment: production
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          architecture: x64
          cache: true
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3.1
          bundler-cache: true
      - run: xcodebuild -version
      - name: Validate iOS release credentials
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          required=(APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_BASE64 MATCH_PASSWORD MATCH_GIT_PRIVATE_KEY)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::production secret ${name} is missing"
              exit 1
            fi
          done
      - name: Create production environment
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_KEY: ${{ secrets.DB_KEY }}
          API_URL: ${{ secrets.API_URL }}
          CDN_URL: ${{ secrets.CDN_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: bash .github/scripts/create-env.sh
      - run: flutter pub get
      - name: Build and submit to App Store review
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: bundle exec fastlane ios submit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-release-${{ github.sha }}
          path: build/ios/ipa/trade_diary.ipa
          if-no-files-found: ignore
          retention-days: 14
