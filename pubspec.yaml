name: trade_diary
description: "감자랑 함께 일기를 써봐요 :)"

publish_to: "none"

version: 1.0.4

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  go_router: ^14.2.0
  flutter_svg: ^2.0.10+1
  google_sign_in: ^6.2.1
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.1.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  markdown_editor_plus: ^0.2.15
  flutter_native_splash: ^2.4.1
  http: ^1.3.0
  image_picker: ^1.1.2
  flutter_riverpod: ^2.5.3
  riverpod_annotation: ^2.5.3
  sign_in_with_apple: ^6.1.4
  flutter_screenutil: ^5.9.3
  table_calendar: ^3.1.3
  intl: ^0.19.0
  url_launcher: ^6.3.1
  sentry_flutter: ^8.12.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.8
  riverpod_lint: ^2.3.13
  freezed: ^2.5.7
  build_runner: ^2.4.12

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/character/img-potato-7lv.png
  android: true
  ios: true

  android_12:
    image: assets/images/character/img-potato-7lv.png
    icon_background_color: "#ffffff"

flutter:
  assets:
    - assets/images/icons/
    - assets/images/character/
    - .env
  fonts:
    - family: EF_Diary
      fonts:
        - asset: assets/fonts/EF_Diary/EF_Diary.ttf
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard/Pretendard-SemiBold.ttf
          weight: 600

  uses-material-design: true
