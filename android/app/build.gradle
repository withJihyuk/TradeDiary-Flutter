plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def requiredSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def missingSigningProperties = requiredSigningProperties.findAll {
    !keystoreProperties.getProperty(it)?.trim()
}
def releaseStoreFile = missingSigningProperties.isEmpty()
    ? file(keystoreProperties.getProperty("storeFile"))
    : null
def hasReleaseSigning = keystorePropertiesFile.exists() &&
    missingSigningProperties.isEmpty() && releaseStoreFile.exists()
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

if (releaseTaskRequested && !hasReleaseSigning) {
    def reason = !keystorePropertiesFile.exists()
        ? "android/key.properties is missing"
        : !missingSigningProperties.isEmpty()
            ? "missing properties: ${missingSigningProperties.join(', ')}"
            : "keystore file does not exist: ${releaseStoreFile}"
    throw new GradleException("Release signing is not configured (${reason}).")
}

android {
    namespace = "com.jihyuk.potatodiary"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.jihyuk.potatodiary"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseStoreFile
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

flutter {
    source = "../.."
}
